spring.application.name=expertconnect

spring.datasource.url=${EXPERTCONNECT_DB_URL:jdbc:mysql://localhost:3306/expertconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${EXPERTCONNECT_DB_USERNAME:root}
spring.datasource.password=${EXPERTCONNECT_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

expertconnect.jwt.secret=${EXPERTCONNECT_JWT_SECRET}
expertconnect.jwt.expiration-ms=${EXPERTCONNECT_JWT_EXPIRATION_MS:86400000}

expertconnect.admin.email=${EXPERTCONNECT_ADMIN_EMAIL}
expertconnect.admin.password=${EXPERTCONNECT_ADMIN_PASSWORD}